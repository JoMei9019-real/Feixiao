name: Build Development

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: Feixiao

      - name: Clone pinned rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git
          git -C rtw88-stable checkout d029a677c49266fad86750714eb5612becd134d3
          test "$(git -C rtw88-stable rev-parse HEAD)" = "d029a677c49266fad86750714eb5612becd134d3"

      - name: Apply shared TX/RA diagnostics
        working-directory: Feixiao
        run: python3 scripts/apply_beta7_tx_diag.py

      - name: Apply Beta 11 safe RSSI fix
        working-directory: Feixiao
        run: python3 scripts/apply_beta11_rssi_fix.py

      - name: Download firmware blobs
        run: |
          cd Feixiao/firmware
          for fw in rtw8822b_fw.bin rtw8822c_fw.bin rtw8821c_fw.bin \
                    rtw8821a_fw.bin rtw8812a_fw.bin rtw8814a_fw.bin; do
            if [ ! -s "$fw" ]; then
              curl -fL --retry 3 -o "$fw" \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
          done

      - name: Test peer aggregation parser
        working-directory: Feixiao
        run: |
          xcrun clang++ -std=c++11 -fsanitize=address,undefined tests/peer_ampdu.cpp -o "$RUNNER_TEMP/peer-ampdu-test"
          "$RUNNER_TEMP/peer-ampdu-test"

      - name: Build
        run: make clean && make -j1 all
        working-directory: Feixiao

      - name: Validate
        run: |
          test -f Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88
          test -x Feixiao/build/out/rtw88ctl
          plutil -lint Feixiao/build/out/rtw88.kext/Contents/Info.plist
          test "$(defaults read "$PWD/Feixiao/build/out/rtw88.kext/Contents/Info" CFBundleVersion)" = "1.0.8"

      - name: Package
        run: |
          mkdir -p Development
          cp -R Feixiao/build/out/rtw88.kext Development/
          cp Feixiao/build/out/rtw88ctl Development/
          ditto -c -k --sequesterRsrc --keepParent Development Feixiao-1.0.8-Beta-11.zip
          shasum -a 256 Feixiao-1.0.8-Beta-11.zip > Feixiao-1.0.8-Beta-11.zip.sha256

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-1.0.8-Beta-11
          path: |
            Feixiao-1.0.8-Beta-11.zip
            Feixiao-1.0.8-Beta-11.zip.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.8-beta.11" \
            "Feixiao-1.0.8-Beta-11.zip" \
            "Feixiao-1.0.8-Beta-11.zip.sha256" \
            --title "Feixiao 1.0.8 Beta 11" \
            --notes "Development prerelease. Beta 11 restores the missing RSSI/firmware-rate-adaptation feedback without reintroducing Beta 8's unsafe mac80211 station lookup. The Linux RX path records pkt_stat RSSI into the registered peer under a short lifetime lock, while a serialized two-second state-machine timer updates rssi_level and sends RSSI information to firmware. ieee80211_find_sta() and ieee80211_find_sta_by_ifaddr() remain safe NULL stubs. Beta 11 also adds a guarded DMA fast path: original packet memory is mapped directly only when it is one physically contiguous segment entirely below 4GB; every other mapping falls back to the existing bounce-buffer path. Beta 10 NAPI-completion RX batching remains enabled. RSSIRA and DMA direct/bounce counters are retained for validation. Main remains stable." \
            --prerelease \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
