name: Build Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: Feixiao

      - name: Clone pinned rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git
          git -C rtw88-stable checkout d029a677c49266fad86750714eb5612becd134d3
          test "$(git -C rtw88-stable rev-parse HEAD)" = "d029a677c49266fad86750714eb5612becd134d3"

      - name: Apply Beta 7 TX/RA diagnostics
        working-directory: Feixiao
        run: python3 scripts/apply_beta7_tx_diag.py

      - name: Download firmware blobs
        run: |
          cd Feixiao/firmware
          for fw in rtw8822b_fw.bin rtw8822c_fw.bin rtw8821c_fw.bin \
                    rtw8821a_fw.bin rtw8812a_fw.bin rtw8814a_fw.bin; do
            if [ ! -s "$fw" ]; then
              curl -fL --retry 3 -o "$fw" \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
          done

      - name: Test peer aggregation parser
        working-directory: Feixiao
        run: |
          xcrun clang++ -std=c++11 -fsanitize=address,undefined tests/peer_ampdu.cpp -o "$RUNNER_TEMP/peer-ampdu-test"
          "$RUNNER_TEMP/peer-ampdu-test"

      - name: Build
        run: make clean && make -j1 all
        working-directory: Feixiao

      - name: Validate
        run: |
          test -f Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88
          test -x Feixiao/build/out/rtw88ctl
          plutil -lint Feixiao/build/out/rtw88.kext/Contents/Info.plist
          test "$(defaults read "$PWD/Feixiao/build/out/rtw88.kext/Contents/Info" CFBundleVersion)" = "1.0.8"

      - name: Package
        run: |
          mkdir -p Development
          cp -R Feixiao/build/out/rtw88.kext Development/
          cp Feixiao/build/out/rtw88ctl Development/
          ditto -c -k --sequesterRsrc --keepParent Development Feixiao-1.0.8-Beta-7.zip
          shasum -a 256 Feixiao-1.0.8-Beta-7.zip > Feixiao-1.0.8-Beta-7.zip.sha256

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-1.0.8-Beta-7
          path: |
            Feixiao-1.0.8-Beta-7.zip
            Feixiao-1.0.8-Beta-7.zip.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.8-beta.7" \
            "Feixiao-1.0.8-Beta-7.zip" \
            "Feixiao-1.0.8-Beta-7.zip.sha256" \
            --title "Feixiao 1.0.8 Beta 7" \
            --notes "Development prerelease. Beta 7 keeps the Beta 6 diagnostics, fixes SGI propagation into TX descriptors, restores the single-station mac80211 iterator used by firmware RA reports, samples real firmware TX ACK/failure status at 1/128 data frames, adds C2H/RA/TX-report diagnostics, an association RA snapshot, and expands the rtw88ctl diagnostic ring to 64 KiB. No queue-threshold, DMA re-kick, fixed-rate, or RX-path experiments are included. Main remains stable." \
            --prerelease \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
