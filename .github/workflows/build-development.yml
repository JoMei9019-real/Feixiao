name: Build Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: Feixiao

      - name: Clone rtw88-stable
        run: git clone --depth 1 https://github.com/thegwchr/rtw88-stable.git

      - name: Download firmware blobs
        run: |
          cd Feixiao/firmware
          for fw in rtw8822b_fw.bin rtw8822c_fw.bin rtw8821c_fw.bin \
                    rtw8821a_fw.bin rtw8812a_fw.bin rtw8814a_fw.bin; do
            if [ ! -s "$fw" ]; then
              curl -fL --retry 3 -o "$fw" \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
          done

      - name: Test peer aggregation parser
        working-directory: Feixiao
        run: |
          xcrun clang++ -std=c++11 -fsanitize=address,undefined tests/peer_ampdu.cpp -o "$RUNNER_TEMP/peer-ampdu-test"
          "$RUNNER_TEMP/peer-ampdu-test"

      - name: Build
        run: make clean && make -j1 all
        working-directory: Feixiao

      - name: Validate
        run: |
          test -f Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88
          test -x Feixiao/build/out/rtw88ctl
          plutil -lint Feixiao/build/out/rtw88.kext/Contents/Info.plist
          test "$(defaults read "$PWD/Feixiao/build/out/rtw88.kext/Contents/Info" CFBundleVersion)" = "1.0.8"

      - name: Package
        run: |
          mkdir -p Development
          cp -R Feixiao/build/out/rtw88.kext Development/
          cp Feixiao/build/out/rtw88ctl Development/
          ditto -c -k --sequesterRsrc --keepParent Development Feixiao-1.0.8-Beta-5.zip
          shasum -a 256 Feixiao-1.0.8-Beta-5.zip > Feixiao-1.0.8-Beta-5.zip.sha256

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-1.0.8-Beta-5
          path: |
            Feixiao-1.0.8-Beta-5.zip
            Feixiao-1.0.8-Beta-5.zip.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.8-beta.5" \
            "Feixiao-1.0.8-Beta-5.zip" \
            "Feixiao-1.0.8-Beta-5.zip.sha256" \
            --title "Feixiao 1.0.8 Beta 5" \
            --notes "Development prerelease. Builds on Beta 4 with three targeted fixes ported from arifianilhamnrr/Feixiao: a larger skb control block with a compile-time TX metadata bounds check, cfg80211-compatible disabled RTS threshold by default, and AP-advertised HT/VHT A-MPDU receive limits. Beta 4 NAPI serialization and ADDBA retry/ACK behavior remain. Intended for testing; main remains the stable branch." \
            --prerelease \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
