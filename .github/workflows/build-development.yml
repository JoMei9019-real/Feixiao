name: Build Release Candidate

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: Feixiao

      - name: Clone pinned rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git
          git -C rtw88-stable checkout d029a677c49266fad86750714eb5612becd134d3
          test "$(git -C rtw88-stable rev-parse HEAD)" = "d029a677c49266fad86750714eb5612becd134d3"

      - name: Apply shared TX/RA diagnostics
        working-directory: Feixiao
        run: python3 scripts/apply_beta7_tx_diag.py

      - name: Apply Beta 16 stable RTL8821C TX fix
        working-directory: Feixiao
        run: python3 scripts/apply_beta16_ra_fix.py

      - name: Download firmware blobs
        run: |
          cd Feixiao/firmware
          for fw in rtw8822b_fw.bin rtw8822c_fw.bin rtw8821c_fw.bin \
                    rtw8821a_fw.bin rtw8812a_fw.bin rtw8814a_fw.bin; do
            if [ ! -s "$fw" ]; then
              curl -fL --retry 3 -o "$fw" \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
          done

      - name: Test peer aggregation parser
        working-directory: Feixiao
        run: |
          xcrun clang++ -std=c++11 -fsanitize=address,undefined tests/peer_ampdu.cpp -o "$RUNNER_TEMP/peer-ampdu-test"
          "$RUNNER_TEMP/peer-ampdu-test"

      - name: Build
        run: make clean && make -j1 all
        working-directory: Feixiao

      - name: Validate
        run: |
          test -f Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88
          test -x Feixiao/build/out/rtw88ctl
          plutil -lint Feixiao/build/out/rtw88.kext/Contents/Info.plist
          test "$(defaults read "$PWD/Feixiao/build/out/rtw88.kext/Contents/Info" CFBundleVersion)" = "1.1.0"
          test "$(defaults read "$PWD/Feixiao/build/out/rtw88.kext/Contents/Info" RTW88BuildLabel)" = "1.1.0 RC1"
          Feixiao/build/out/rtw88ctl --version | grep -q "rtw88ctl:    1.1.0 RC1"

      - name: Package
        run: |
          rm -rf Feixiao-1.1.0-RC1
          mkdir -p Feixiao-1.1.0-RC1
          cp -R Feixiao/build/out/rtw88.kext Feixiao-1.1.0-RC1/
          cp Feixiao/build/out/rtw88ctl Feixiao-1.1.0-RC1/
          ditto -c -k --sequesterRsrc --keepParent Feixiao-1.1.0-RC1 Feixiao-1.1.0-RC1.zip
          shasum -a 256 Feixiao-1.1.0-RC1.zip > Feixiao-1.1.0-RC1.zip.sha256

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-1.1.0-RC1
          path: |
            Feixiao-1.1.0-RC1.zip
            Feixiao-1.1.0-RC1.zip.sha256

      - name: Publish prerelease
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.0-rc.1"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "Feixiao-1.1.0-RC1.zip" \
              "Feixiao-1.1.0-RC1.zip.sha256" \
              --clobber \
              --repo "${{ github.repository }}"
            gh release edit "$TAG" \
              --title "Feixiao 1.1.0 RC1" \
              --notes "Release Candidate for Feixiao 1.1.0. RC1 is based on the validated Beta 16 data path: RTL8821CE uses firmware automatic rate adaptation by default with TX STBC disabled, while the WPA duplicate-M3 fix, AP disconnect cleanup, corrected RSSI EWMA, stable RA-mask handling, PHYINFO feedback, SGI and A-MPDU support remain unchanged. Detailed diagnostics stay available through 'rtw88ctl diag on|off' but are disabled by default; TX-status sampling is reduced and capped so diagnostics cannot build an unbounded TXRPT queue. New in 1.1.0 RC1: IOKit suspend/resume support cleanly stops the firmware/core before system sleep, restores PCI bus mastering and memory decoding on wake, restarts the rtw88 core, suppresses RSSI/PHY H2C work while asleep, and schedules reconnect to the previous AP. 'rtw88ctl version' continues to report both the control utility and loaded driver build plus diagnostics/rate state. This is a prerelease candidate for final 1.1.0; main remains stable." \
              --prerelease \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              "Feixiao-1.1.0-RC1.zip" \
              "Feixiao-1.1.0-RC1.zip.sha256" \
              --title "Feixiao 1.1.0 RC1" \
              --notes "Release Candidate for Feixiao 1.1.0. RC1 is based on the validated Beta 16 data path: RTL8821CE uses firmware automatic rate adaptation by default with TX STBC disabled, while the WPA duplicate-M3 fix, AP disconnect cleanup, corrected RSSI EWMA, stable RA-mask handling, PHYINFO feedback, SGI and A-MPDU support remain unchanged. Detailed diagnostics stay available through 'rtw88ctl diag on|off' but are disabled by default; TX-status sampling is reduced and capped so diagnostics cannot build an unbounded TXRPT queue. New in 1.1.0 RC1: IOKit suspend/resume support cleanly stops the firmware/core before system sleep, restores PCI bus mastering and memory decoding on wake, restarts the rtw88 core, suppresses RSSI/PHY H2C work while asleep, and schedules reconnect to the previous AP. 'rtw88ctl version' reports both the control utility and loaded driver build plus diagnostics/rate state. This is a prerelease candidate for final 1.1.0; main remains stable." \
              --prerelease \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi
