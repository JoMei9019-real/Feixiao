name: Build Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feixiao-development-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: Feixiao

      - name: Clone pinned rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git
          git -C rtw88-stable checkout d029a677c49266fad86750714eb5612becd134d3
          test "$(git -C rtw88-stable rev-parse HEAD)" = "d029a677c49266fad86750714eb5612becd134d3"

      - name: Apply shared TX/RA diagnostics
        working-directory: Feixiao
        run: python3 scripts/apply_beta7_tx_diag.py

      - name: Apply Beta 16 stable RTL8821C TX fix
        working-directory: Feixiao
        run: python3 scripts/apply_beta16_ra_fix.py

      - name: Apply macOS sleep/wake PCI ring reinit
        working-directory: Feixiao
        run: python3 scripts/apply_sleep_pci_reinit.py

      - name: Download firmware blobs
        run: |
          cd Feixiao/firmware
          for fw in rtw8822b_fw.bin rtw8822c_fw.bin rtw8821c_fw.bin \
                    rtw8821a_fw.bin rtw8812a_fw.bin rtw8814a_fw.bin; do
            if [ ! -s "$fw" ]; then
              curl -fL --retry 3 -o "$fw" \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
          done

      - name: Test peer aggregation parser
        working-directory: Feixiao
        run: |
          xcrun clang++ -std=c++11 -fsanitize=address,undefined tests/peer_ampdu.cpp -o "$RUNNER_TEMP/peer-ampdu-test"
          "$RUNNER_TEMP/peer-ampdu-test"

      - name: Build
        run: make clean && make -j1 all
        working-directory: Feixiao

      - name: Validate
        run: |
          test -f Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88
          test -x Feixiao/build/out/rtw88ctl
          plutil -lint Feixiao/build/out/rtw88.kext/Contents/Info.plist
          test "$(defaults read "$PWD/Feixiao/build/out/rtw88.kext/Contents/Info" CFBundleVersion)" = "1.1.0"
          test "$(defaults read "$PWD/Feixiao/build/out/rtw88.kext/Contents/Info" RTW88BuildLabel)" = "1.1.0 Development 1.2"
          Feixiao/build/out/rtw88ctl --version | grep -q "rtw88ctl:    1.1.0 Development 1.2"

      - name: Package
        run: |
          rm -rf Feixiao-1.1.0-Development-1.2
          mkdir -p Feixiao-1.1.0-Development-1.2
          cp -R Feixiao/build/out/rtw88.kext Feixiao-1.1.0-Development-1.2/
          cp Feixiao/build/out/rtw88ctl Feixiao-1.1.0-Development-1.2/
          ditto -c -k --sequesterRsrc --keepParent Feixiao-1.1.0-Development-1.2 Feixiao-1.1.0-Development-1.2.zip
          shasum -a 256 Feixiao-1.1.0-Development-1.2.zip > Feixiao-1.1.0-Development-1.2.zip.sha256

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-1.1.0-Development-1.2
          path: |
            Feixiao-1.1.0-Development-1.2.zip
            Feixiao-1.1.0-Development-1.2.zip.sha256

      # Development pushes intentionally stop at the downloadable artifact.
      # A release candidate is published only after the sleep/wake build has
      # been validated on hardware.
