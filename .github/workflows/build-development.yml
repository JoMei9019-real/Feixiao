name: Build Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: Feixiao

      - name: Clone pinned rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git
          git -C rtw88-stable checkout d029a677c49266fad86750714eb5612becd134d3
          test "$(git -C rtw88-stable rev-parse HEAD)" = "d029a677c49266fad86750714eb5612becd134d3"

      - name: Apply shared TX/RA diagnostics
        working-directory: Feixiao
        run: python3 scripts/apply_beta7_tx_diag.py

      - name: Apply Beta 15 stability fixes
        working-directory: Feixiao
        run: python3 scripts/apply_beta15_ra_fix.py

      - name: Download firmware blobs
        run: |
          cd Feixiao/firmware
          for fw in rtw8822b_fw.bin rtw8822c_fw.bin rtw8821c_fw.bin \
                    rtw8821a_fw.bin rtw8812a_fw.bin rtw8814a_fw.bin; do
            if [ ! -s "$fw" ]; then
              curl -fL --retry 3 -o "$fw" \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
          done

      - name: Test peer aggregation parser
        working-directory: Feixiao
        run: |
          xcrun clang++ -std=c++11 -fsanitize=address,undefined tests/peer_ampdu.cpp -o "$RUNNER_TEMP/peer-ampdu-test"
          "$RUNNER_TEMP/peer-ampdu-test"

      - name: Build
        run: make clean && make -j1 all
        working-directory: Feixiao

      - name: Validate
        run: |
          test -f Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88
          test -x Feixiao/build/out/rtw88ctl
          plutil -lint Feixiao/build/out/rtw88.kext/Contents/Info.plist
          test "$(defaults read "$PWD/Feixiao/build/out/rtw88.kext/Contents/Info" CFBundleVersion)" = "1.0.8"

      - name: Package
        run: |
          mkdir -p Development
          cp -R Feixiao/build/out/rtw88.kext Development/
          cp Feixiao/build/out/rtw88ctl Development/
          ditto -c -k --sequesterRsrc --keepParent Development Feixiao-1.0.8-Beta-15.zip
          shasum -a 256 Feixiao-1.0.8-Beta-15.zip > Feixiao-1.0.8-Beta-15.zip.sha256

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-1.0.8-Beta-15
          path: |
            Feixiao-1.0.8-Beta-15.zip
            Feixiao-1.0.8-Beta-15.zip.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.8-beta.15"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "Feixiao-1.0.8-Beta-15.zip" \
              "Feixiao-1.0.8-Beta-15.zip.sha256" \
              --clobber \
              --repo "${{ github.repository }}"
            gh release edit "$TAG" \
              --title "Feixiao 1.0.8 Beta 15" \
              --notes "Development prerelease. Beta 15 combines the current stability fixes to minimize test/reboot cycles: Linux-compatible RSSI EWMA remains fixed; the 2-second RSSI timer now updates only firmware RSSI/rssi_level and no longer calls rtw_update_sta_info(), preserving the association-time RA mask during WPA/early rate probing; duplicate WPA2 M3 received after CONNECTED is MIC/replay validated and answered with M4 again without reinstalling PTK/GTK; AP-originated deauth/disassoc now clears association state, unregisters/removes/frees the STA, cancels timers, and prevents stale RSSI writes/reconnect Device Busy states. Generic ieee80211_find_sta* remains disabled. Beta 11 DMA and Beta 10 NAPI RX batching remain unchanged. Main remains stable." \
              --prerelease \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              "Feixiao-1.0.8-Beta-15.zip" \
              "Feixiao-1.0.8-Beta-15.zip.sha256" \
              --title "Feixiao 1.0.8 Beta 15" \
              --notes "Development prerelease. Beta 15 combines the current stability fixes to minimize test/reboot cycles: Linux-compatible RSSI EWMA remains fixed; the 2-second RSSI timer now updates only firmware RSSI/rssi_level and no longer calls rtw_update_sta_info(), preserving the association-time RA mask during WPA/early rate probing; duplicate WPA2 M3 received after CONNECTED is MIC/replay validated and answered with M4 again without reinstalling PTK/GTK; AP-originated deauth/disassoc now clears association state, unregisters/removes/frees the STA, cancels timers, and prevents stale RSSI writes/reconnect Device Busy states. Generic ieee80211_find_sta* remains disabled. Beta 11 DMA and Beta 10 NAPI RX batching remain unchanged. Main remains stable." \
              --prerelease \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi
