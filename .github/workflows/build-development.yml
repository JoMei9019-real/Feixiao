name: Build Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: Feixiao

      - name: Clone pinned rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git
          git -C rtw88-stable checkout d029a677c49266fad86750714eb5612becd134d3
          test "$(git -C rtw88-stable rev-parse HEAD)" = "d029a677c49266fad86750714eb5612becd134d3"

      - name: Apply shared TX/RA diagnostics
        working-directory: Feixiao
        run: python3 scripts/apply_beta7_tx_diag.py

      - name: Apply Beta 12 isolated RSSI/RA fix
        working-directory: Feixiao
        run: python3 scripts/apply_beta12_ra_fix.py

      - name: Download firmware blobs
        run: |
          cd Feixiao/firmware
          for fw in rtw8822b_fw.bin rtw8822c_fw.bin rtw8821c_fw.bin \
                    rtw8821a_fw.bin rtw8812a_fw.bin rtw8814a_fw.bin; do
            if [ ! -s "$fw" ]; then
              curl -fL --retry 3 -o "$fw" \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
          done

      - name: Test peer aggregation parser
        working-directory: Feixiao
        run: |
          xcrun clang++ -std=c++11 -fsanitize=address,undefined tests/peer_ampdu.cpp -o "$RUNNER_TEMP/peer-ampdu-test"
          "$RUNNER_TEMP/peer-ampdu-test"

      - name: Build
        run: make clean && make -j1 all
        working-directory: Feixiao

      - name: Validate
        run: |
          test -f Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88
          test -x Feixiao/build/out/rtw88ctl
          plutil -lint Feixiao/build/out/rtw88.kext/Contents/Info.plist
          test "$(defaults read "$PWD/Feixiao/build/out/rtw88.kext/Contents/Info" CFBundleVersion)" = "1.0.8"

      - name: Package
        run: |
          mkdir -p Development
          cp -R Feixiao/build/out/rtw88.kext Development/
          cp Feixiao/build/out/rtw88ctl Development/
          ditto -c -k --sequesterRsrc --keepParent Development Feixiao-1.0.8-Beta-12.zip
          shasum -a 256 Feixiao-1.0.8-Beta-12.zip > Feixiao-1.0.8-Beta-12.zip.sha256

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-1.0.8-Beta-12
          path: |
            Feixiao-1.0.8-Beta-12.zip
            Feixiao-1.0.8-Beta-12.zip.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.8-beta.12" \
            "Feixiao-1.0.8-Beta-12.zip" \
            "Feixiao-1.0.8-Beta-12.zip.sha256" \
            --title "Feixiao 1.0.8 Beta 12" \
            --notes "Development prerelease. Beta 12 isolates the missing RSSI-to-firmware-rate-adaptation path while keeping Beta 8's unsafe ieee80211_find_sta* behavior disabled. RX PHY samples feed the already-registered associated peer's EWMA under a short lifetime lock. A serialized two-second timer verifies STA identity, uses upstream rtw_phy_get_rssi_level() classification, sends rtw_fw_send_rssi_info(), and refreshes rtw_update_sta_info() on RSSI-level changes or every fourth tick to mirror stock RA cadence without enabling DIG, DPK, power tracking, or the rest of rtw_phy_dynamic_mechanism(). RSSI_DBG logs expose write/read pointer identity, EWMA values, station iteration, classification, RA-mask refresh cadence, and scan-state skips. Beta 11 DMA fast-path and Beta 10 NAPI RX batching remain unchanged. Main remains stable." \
            --prerelease \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
